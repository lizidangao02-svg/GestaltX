name: Build IPA

on:
  release:
    types: [published]
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.build.outputs.version }}
    env:
      REF: ${{ github.event.release.tag_name || inputs.ref || github.ref }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.1'

      - name: Run cleanup path tests
        run: |
          clang -std=c11 -Wall -Wextra -Werror GestaltX/WQCleanup.c tests/WQCleanupTests.c -o "$RUNNER_TEMP/wq-cleanup-tests"
          "$RUNNER_TEMP/wq-cleanup-tests"

      - name: Build IPA
        id: build
        run: .github/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"

      - name: Attest IPA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.build.outputs.ipa }}

      - name: Record build provenance
        id: provenance
        env:
          IPA: ${{ steps.build.outputs.ipa }}
        run: |
          metadata="$RUNNER_TEMP/GestaltX-build.txt"
          {
            printf 'commit=%s\\n' "$(git rev-parse HEAD)"
            xcodebuild -version
            shasum -a 256 "$IPA"
          } > "$metadata"
          checksum="$IPA.sha256"
          shasum -a 256 "$IPA" > "$checksum"
          artifact_dir="$RUNNER_TEMP/GestaltX-artifacts"
          mkdir -p "$artifact_dir"
          cp "$IPA" "$checksum" "$metadata" CHANGELOG.md CHANGELOG_ZH-CN.md "$artifact_dir/"
          echo "directory=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GestaltX-${{ steps.build.outputs.version }}
          path: ${{ steps.provenance.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GestaltX-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"
          printf 'English | [简体中文](https://github.com/huamidev/GestaltX/blob/%s/CHANGELOG_ZH-CN.md)\\n\\n' "$TAG" > "$notes"
          awk -v ver="$version" '
            $0 ~ "^## \\\\[" ver "\\\\]" { found = 1; next }
            found && /^## \\[/ { exit }
            found { if (!started && $0 == "") next; started = 1; print }
          ' dist/CHANGELOG.md >> "$notes"
          if ! grep -q '^### ' "$notes"; then
            printf 'GestaltX %s\\n' "$TAG" >> "$notes"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag \\
              --title "GestaltX $TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" \\
            "dist/GestaltX_${version}.ipa" \\
            dist/CHANGELOG.md dist/CHANGELOG_ZH-CN.md \\
            --clobber
